[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors    = ["natepiano"]
edition    = "2024"
license    = "MIT OR Apache-2.0"
repository = "https://github.com/natepiano/cargo-liner"

[workspace.dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1"
cargo_metadata = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
confique = "0.4"
crossbeam-channel = "0.5"
crossterm = "0.29.0"
dark-light = "2"
dirs = "6.0.0"
ignore = "0.4"
indexmap = "2"
itertools = "0.15.0"
libc = "0.2.189"
notify = "9.0.0-rc.2"
nucleo-matcher = "0.3.1"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-io-kit = { version = "0.3.2", default-features = false }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
processkit = { version = "3.1.0", default-features = false, features = [
  "process-control",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
quote = "1.0"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = "0.13.4"
rustc-hash = "2"
rustix = "1.1.4"
serde = "1"
serde_json = "1"
sha2 = "0.11.0"
strum = "0.28.0"
syn = { version = "3.0.3", features = ["full", "visit"] }
sysinfo = "0.39.6"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
thiserror = "2"
tokei = "14.0.0"
tokio = "1"
toml = "1.1.4"
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = "0.3"
# Path-only on main. `cargo publish` rejects a path-only dependency, so the
# release branch rewrites this to the last published version via the
# `[[publish_path_pins]]` entry in .claude/config/release.toml; main keeps the
# path by construction and is never edited by a release.
tui_pane      = { path = "crates/tui_pane" }
unicode-width = "0.2.2"
walkdir       = "2.5"

[workspace.lints.clippy]
# Strict per-rule denies. Test modules opt back in via:
#   #[allow(clippy::expect_used, reason = "tests should panic on unexpected values")]
allow_attributes_without_reason = "deny"
expect_used                     = "deny"
panic                           = "deny"
self_named_module_files         = "deny" # use module/mod.rs (directory form) when a module has submodules
undocumented_unsafe_blocks      = "deny" # every unsafe block carries a `// SAFETY:` justification
unreachable                     = "deny"
unwrap_used                     = "deny"

# Lint groups as deny with lower priority so per-rule allows below override.
all      = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Conflicts with common patterns.
multiple_crate_versions = "allow"
redundant_pub_crate     = "allow"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code  = "deny" # FFI-only; opt back in per item with a reasoned allow
