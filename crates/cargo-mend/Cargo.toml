[package]
authors.workspace    = true
categories           = ["development-tools::cargo-plugins"]
description          = "Opinionated visibility auditing for Rust crates and workspaces"
edition.workspace    = true
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/cargo-mend"
keywords             = ["cargo", "lints", "visibility"]
license.workspace    = true
name                 = "cargo-mend"
readme               = "README.md"
repository.workspace = true
version              = "0.20.0"

[[test]]
name = "diagnostics"
path = "tests/diagnostics/mod.rs"

[features]
test-counters = []

[lints]
workspace = true

[dependencies]
anyhow         = { workspace = true }
cargo_metadata = { workspace = true }
clap           = { workspace = true, features = ["derive"] }
dirs           = { workspace = true }
proc-macro2    = { workspace = true, features = ["span-locations"] }
quote          = { workspace = true }
rayon          = { workspace = true }
regex          = { workspace = true }
rustc-hash     = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
syn            = { workspace = true, features = ["full", "visit"] }
tempfile       = { workspace = true }
toml           = { workspace = true }
toml_edit      = { workspace = true }
walkdir        = { workspace = true }
