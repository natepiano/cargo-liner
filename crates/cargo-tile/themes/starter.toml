# Starter theme for cargo-tile.
#
# Copy this file into your themes directory to customize colors:
#
#   mkdir -p ~/.config/cargo-tile/themes
#   cp starter.toml ~/.config/cargo-tile/themes/
#
# Then point config.toml at the variant name below:
#
#   [appearance]
#   mode       = "dark"
#   dark_theme = "Cargo Tile Dark"
#
# Every section is required — the parser rejects unknown keys and has no
# per-field defaults, so edit values in place rather than deleting blocks.

name   = "Cargo Tile"
schema = 1

[[variants]]
appearance = "dark"
name       = "Cargo Tile Dark"

[variants.pane_chrome]
active_title    = { color = "Yellow", bold = true }
inactive_border = "DarkGray"
inactive_title  = "White"

[variants.focus]
active     = { r = 125, g = 125, b = 125 }
hover      = { r = 80, g = 80, b = 80 }
remembered = { r = 40, g = 40, b = 40 }

[variants.semantic]
accent       = "Cyan"
error        = { r = 255, g = 115, b = 115 }
inline_error = "Yellow"
label        = { r = 150, g = 190, b = 180 }
on_error     = "White"
success      = "Green"
warning      = "Yellow"

[variants.text]
bg_focus  = "Black"
bright    = "Cyan"
default   = "White"
dim       = "DarkGray"
secondary = "Gray"

[variants.roles]
family_blue    = { r = 140, g = 150, b = 255 }
family_cyan    = { r = 0, g = 205, b = 205 }
family_green   = { r = 148, g = 210, b = 0 }
family_magenta = { r = 255, g = 110, b = 207 }
family_orange  = { r = 255, g = 185, b = 45 }
family_red     = { r = 255, g = 115, b = 115 }
family_violet  = { r = 209, g = 130, b = 255 }
family_yellow  = { r = 230, g = 205, b = 0 }

[variants.status]
bar = "DarkGray"

[variants.finder]
match_bg = { r = 0, g = 90, b = 100 }

[variants.disk_usage]
high = { r = 255, g = 100, b = 100 }
low  = { r = 100, g = 220, b = 100 }
mid  = { r = 255, g = 255, b = 255 }
