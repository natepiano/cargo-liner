[package]
authors.workspace    = true
categories           = ["command-line-utilities", "development-tools"]
description          = "A terminal UI cargo tool"
edition.workspace    = true
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/cargo-tile"
keywords             = ["cargo", "rust", "tile", "tui"]
license.workspace    = true
name                 = "cargo-tile"
readme               = "README.md"
repository.workspace = true
version              = "0.2.78-dev"

[lints]
workspace = true

# Unit tests run from the `unit_tests` integration target, which cargo builds after
# this binary and gives `CARGO_BIN_EXE_cargo-tile`.
[[bin]]
name = "cargo-tile"
path = "src/main.rs"
test = false

[features]
attract = ["tui_pane/backdrop"]
default = ["attract"]

[dependencies]
chrono = { workspace = true }
clap   = { workspace = true }
# Level-triggered polling preserves keyboard readiness beside SIGWINCH.
crossterm     = { workspace = true, features = ["use-dev-tty"] }
dirs          = { workspace = true }
ratatui       = { workspace = true }
rustix        = { workspace = true, features = ["fs", "process"] }
serde         = { workspace = true, features = ["derive"] }
sysinfo       = { workspace = true }
tempfile      = { workspace = true }
toml          = { workspace = true }
unicode-width = { workspace = true }
uuid          = { workspace = true }

# The attract feature enables desktop capture in the tui_pane framework.
tui_pane = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
census-test-support = { workspace = true }
