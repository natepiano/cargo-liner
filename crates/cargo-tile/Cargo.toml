[package]
authors.workspace    = true
categories           = ["command-line-utilities", "development-tools"]
description          = "A terminal UI cargo tool"
edition.workspace    = true
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/cargo-tile"
keywords             = ["cargo", "rust", "tile", "tui"]
license.workspace    = true
name                 = "cargo-tile"
readme               = "README.md"
repository.workspace = true
version              = "0.2.77-dev"

[lints]
workspace = true

[dependencies]
chrono        = { workspace = true }
clap          = { workspace = true }
crossterm     = { workspace = true }
dirs          = { workspace = true }
ratatui       = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
sysinfo       = { workspace = true }
toml          = { workspace = true }
unicode-width = { workspace = true }
uuid          = { workspace = true }

# tui_pane provides the framework used by the binary. `backdrop` is what
# captures the desktop behind the window for the attract screen.
tui_pane = { workspace = true, features = ["backdrop"] }

[dev-dependencies]
tempfile = { workspace = true }
