# Proposed role palette. Account assignments match the shared statusline file.
# role.<role-with-hyphens> and account.<label> set field colors.
# level.* colors show usage levels; tokens.* are percent used, left.* percent left.
# counts.<type> colors each part of the "For you:" row; questions are red to catch the eye.
role.showrunner=purple
role.unit-director=yellow
role.astra-designer=pink
role.astra-reviewer=bright-green

account.claude1=brown
account.claude2=magenta
account.claude3=blue
account.claude4=orange
account.codex1=pink
account.codex2=teal

counts.questions=bright-red
counts.changes=bright-cyan
counts.efficiency=bright-green
counts.proposals=purple
counts.projects=orange

level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
tokens.warn=80
tokens.alarm=90
left.warn=10
left.alarm=5
