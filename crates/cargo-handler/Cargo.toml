[package]
authors.workspace    = true
categories           = ["command-line-utilities", "development-tools"]
description          = "A terminal UI cargo tool"
edition.workspace    = true
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/cargo-handler"
keywords             = ["cargo", "rust", "tui"]
license.workspace    = true
name                 = "cargo-handler"
readme               = "README.md"
repository.workspace = true
version              = "0.1.0-dev"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
# Level-triggered polling preserves keyboard readiness beside SIGWINCH.
crossterm = { workspace = true, features = ["use-dev-tty"] }
ratatui   = { workspace = true }
serde     = { workspace = true, features = ["derive"] }

# tui_pane provides the framework used by the binary. `backdrop` is what
# captures the desktop behind the window for the attract screen.
tui_pane = { workspace = true, features = ["backdrop"] }

[dev-dependencies]
toml = { workspace = true }
