# Starter theme for cargo-handler.
#
# Copy this file into your themes directory to customize colors:
#
#   mkdir -p ~/.config/cargo-handler/themes
#   cp starter.toml ~/.config/cargo-handler/themes/
#
# Then point config.toml at the variant name below:
#
#   [appearance]
#   mode       = "dark"
#   dark_theme = "Cargo Handler Dark"
#
# Every section is required — the parser rejects unknown keys and has no
# per-field defaults, so edit values in place rather than deleting blocks.

name   = "Cargo Handler"
schema = 1

[[variants]]
appearance = "dark"
name       = "Cargo Handler Dark"

session_hues = [
  { r = 245, g = 186, b = 38 },
  { r = 218, g = 251, b = 142 },
  { r = 73, g = 249, b = 195 },
  { r = 41, g = 189, b = 172 },
  { r = 249, g = 193, b = 253 },
]

[variants.pane_chrome]
active_title    = { color = { r = 255, g = 210, b = 160 }, bold = true }
inactive_border = "DarkGray"
inactive_title  = "White"

[variants.focus]
active     = { r = 125, g = 125, b = 125 }
hover      = { r = 80, g = 80, b = 80 }
remembered = { r = 40, g = 40, b = 40 }

[variants.semantic]
accent       = "Cyan"
error        = { r = 255, g = 115, b = 115 }
inline_error = "Yellow"
label        = { r = 150, g = 190, b = 180 }
on_error     = "White"
success      = "Green"
warning      = "Yellow"

[variants.text]
bg_focus  = "Black"
bright    = "Cyan"
default   = "White"
dim       = "DarkGray"
secondary = "Gray"

[variants.roles]
busy   = { r = 100, g = 220, b = 100 }
claude = { r = 217, g = 119, b = 87 }
codex  = { r = 175, g = 140, b = 255 }
idle   = { r = 140, g = 140, b = 140 }

shell       = { r = 140, g = 230, b = 240 }
unreachable = { r = 255, g = 100, b = 100 }

[variants.status]
bar = { r = 60, g = 60, b = 60 }

[variants.finder]
match_bg = { r = 0, g = 90, b = 100 }

[variants.disk_usage]
high = { r = 255, g = 100, b = 100 }
low  = { r = 100, g = 220, b = 100 }
mid  = { r = 255, g = 255, b = 255 }
