# Default Dark — cargo-handler's built-in dark palette, mirrored as TOML.
#
# This file is documentation. The app does NOT load it at startup; the
# Rust constructor `default_dark()` in src/theme.rs produces
# the same values.
#
# `inactive_border` is the shade the whole tile grid draws in, focused
# or not: a border is a cell two tiles share, so focus is carried by the
# background tint under a tile's contents instead of by its border.
#
# Copy this file into ~/.config/cargo-handler/themes/ as a starting point
# for a custom theme; rename the variant so it registers alongside the
# built-in instead of replacing it. themes/starter.toml is the same
# idea already renamed.
#
# The tests in src/theme.rs lock this file against drift.

name   = "Default"
schema = 1

[[variants]]
appearance = "dark"
name       = "Default Dark"

[variants.pane_chrome]
active_title    = { color = "Yellow", bold = true }
inactive_border = "DarkGray"
inactive_title  = "White"

[variants.focus]
active     = { r = 125, g = 125, b = 125 }
hover      = { r = 80, g = 80, b = 80 }
remembered = { r = 40, g = 40, b = 40 }

[variants.semantic]
accent       = "Cyan"
error        = "Red"
inline_error = "Yellow"
label        = { r = 150, g = 190, b = 180 }
success      = "Green"
warning      = "Yellow"

[variants.text]
bg_focus  = "Black"
bright    = "Cyan"
default   = "White"
dim       = "DarkGray"
secondary = "Gray"

[variants.roles]
busy           = { r = 100, g = 220, b = 100 }
claude         = { r = 217, g = 119, b = 87 }
codex          = { r = 175, g = 140, b = 255 }
idle           = { r = 140, g = 140, b = 140 }
rainbow_blue   = { r = 100, g = 150, b = 255 }
rainbow_cyan   = { r = 80, g = 210, b = 230 }
rainbow_green  = { r = 110, g = 220, b = 110 }
rainbow_orange = { r = 255, g = 165, b = 70 }
rainbow_red    = { r = 255, g = 95, b = 95 }
rainbow_violet = { r = 190, g = 130, b = 255 }
rainbow_yellow = { r = 240, g = 220, b = 80 }
shell          = { r = 90, g = 200, b = 220 }
unreachable    = { r = 255, g = 100, b = 100 }

[variants.status]
bar = "DarkGray"

[variants.finder]
match_bg = { r = 0, g = 90, b = 100 }

[variants.disk_usage]
high = { r = 255, g = 100, b = 100 }
low  = { r = 100, g = 220, b = 100 }
mid  = { r = 255, g = 255, b = 255 }
