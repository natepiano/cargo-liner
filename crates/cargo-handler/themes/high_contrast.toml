# High Contrast — cargo-handler's built-in high-contrast pair, mirrored as
# TOML.
#
# This file is documentation. The app does NOT load it at startup; the
# Rust constructors `high_contrast_dark()` and `high_contrast_light()`
# in src/theme.rs produce the same values.
#
# Copy this file into ~/.config/cargo-handler/themes/ as a starting point
# for a custom theme; rename the variant so it registers alongside the
# built-in instead of replacing it. themes/starter.toml is the same
# idea already renamed.
#
# The tests in src/theme.rs lock this file against drift.

name   = "High Contrast"
schema = 1

[[variants]]
appearance = "dark"
name       = "High Contrast Dark"

session_hues = [
  { r = 245, g = 186, b = 38 },
  { r = 205, g = 246, b = 140 },
  { r = 85, g = 185, b = 69 },
  { r = 7, g = 229, b = 182 },
  { r = 249, g = 193, b = 253 },
]

[variants.pane_chrome]
active_title    = { color = { r = 255, g = 210, b = 160 }, bold = true }
inactive_border = "White"
inactive_title  = "White"

[variants.focus]
active     = { r = 0, g = 60, b = 100 }
hover      = { r = 0, g = 40, b = 70 }
remembered = { r = 0, g = 25, b = 50 }

[variants.semantic]
accent       = { color = "LightCyan", bold = true }
error        = { color = { r = 255, g = 115, b = 115 }, bold = true }
inline_error = { color = "LightYellow", bold = true }
label        = { r = 175, g = 215, b = 200 }
on_error     = "White"
success      = { color = "LightGreen", bold = true }
warning      = { color = "LightYellow", bold = true }

[variants.text]
bg_focus  = "Black"
bright    = { color = "LightYellow", bold = true }
default   = "White"
dim       = "Gray"
secondary = "White"

[variants.roles]
reset_farthest = { r = 69, g = 196, b = 153 }
reset_nearest  = { r = 125, g = 191, b = 110 }

busy   = { color = "LightGreen", bold = true }
claude = { color = { r = 255, g = 150, b = 90 }, bold = true }
codex  = { color = "LightMagenta", bold = true }
idle   = "Gray"

shell       = { color = "LightCyan", bold = true }
unreachable = { color = "LightRed", bold = true }

[variants.status]
bar = { r = 60, g = 60, b = 60 }

[variants.finder]
match_bg = "LightYellow"

[variants.disk_usage]
high = { color = "LightRed", bold = true }
low  = { color = "LightGreen", bold = true }
mid  = "White"

[[variants]]
appearance = "light"
name       = "High Contrast Light"

session_hues = [
  { r = 0, g = 35, b = 86 },
  { r = 68, g = 0, b = 29 },
  { r = 37, g = 0, b = 67 },
  { r = 81, g = 12, b = 0 },
  { r = 92, g = 40, b = 87 },
]

[variants.pane_chrome]
active_title    = { color = { r = 54, g = 58, b = 61 }, bold = true }
inactive_border = "Black"
inactive_title  = "Black"

[variants.focus]
active     = { r = 255, g = 230, b = 100 }
hover      = { r = 255, g = 245, b = 180 }
remembered = { r = 255, g = 250, b = 220 }

[variants.semantic]
accent       = { color = { r = 0, g = 0, b = 140 }, bold = true }
error        = { color = { r = 180, g = 0, b = 0 }, bold = true }
inline_error = { color = { r = 140, g = 60, b = 0 }, bold = true }
label        = { r = 40, g = 85, b = 75 }
on_error     = "White"
success      = { color = { r = 0, g = 100, b = 0 }, bold = true }
warning      = { color = { r = 140, g = 60, b = 0 }, bold = true }

[variants.text]
bg_focus  = "White"
bright    = { color = { r = 140, g = 60, b = 0 }, bold = true }
default   = "Black"
dim       = { r = 80, g = 80, b = 80 }
secondary = "Black"

[variants.roles]
reset_farthest = { r = 28, g = 3, b = 61 }
reset_nearest  = { r = 136, g = 35, b = 253 }

busy   = { color = { r = 0, g = 100, b = 0 }, bold = true }
claude = { color = { r = 160, g = 60, b = 0 }, bold = true }
codex  = { color = { r = 100, g = 0, b = 160 }, bold = true }
idle   = { r = 80, g = 80, b = 80 }

shell       = { color = { r = 0, g = 80, b = 65 }, bold = true }
unreachable = { color = { r = 180, g = 0, b = 0 }, bold = true }

[variants.status]
bar = { r = 210, g = 210, b = 210 }

[variants.finder]
match_bg = { r = 255, g = 230, b = 100 }

[variants.disk_usage]
high = { color = { r = 180, g = 0, b = 0 }, bold = true }
low  = { color = { r = 0, g = 100, b = 0 }, bold = true }
mid  = "Black"
