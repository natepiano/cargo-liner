[package]
authors.workspace    = true
categories           = ["command-line-utilities", "development-tools"]
description          = "Reusable ratatui pane framework: keymap, status bar, framework panes."
edition.workspace    = true
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/tui_pane"
keywords             = ["keymap", "pane", "ratatui", "tui"]
license.workspace    = true
name                 = "tui_pane"
readme               = "README.md"
repository.workspace = true
version              = "0.7.0"

[lints]
workspace = true

[features]
clipboard = ["crossterm/osc52"]
default   = ["clipboard"]

[dependencies]
crossbeam-channel  = { workspace = true }
crossterm          = { workspace = true }
dark-light         = { workspace = true }
dirs               = { workspace = true }
ratatui            = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
sysinfo            = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt", "time"] }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
unicode-width      = { workspace = true }

# Used for the IOKit GPU sampler and the P/E core cluster map. Every feature
# but "CFData" is already in the tree via sysinfo.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = [
  "CFBase",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "std",
] }
objc2-io-kit = { workspace = true, features = ["libc", "std"] }
