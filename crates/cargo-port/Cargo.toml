[package]
authors.workspace = true
categories        = ["command-line-utilities", "development-tools"]
description       = "A TUI for inspecting and managing Rust projects"
edition.workspace = true
# README screenshots live on GitHub; crates.io rewrites the relative image
# links against `repository`, so the crate itself doesn't need to ship them.
exclude              = ["assets/"]
homepage             = "https://github.com/natepiano/cargo-liner/tree/main/crates/cargo-port"
keywords             = ["cargo", "inspect", "project", "rust", "tui"]
license.workspace    = true
name                 = "cargo-port"
readme               = "README.md"
repository.workspace = true
version              = "0.8.0-dev"

[dependencies]
ansi-to-tui          = { workspace = true }
anyhow               = { workspace = true }
cargo_metadata       = { workspace = true }
chrono               = { workspace = true }
confique             = { workspace = true, features = ["toml"] }
crossbeam-channel    = { workspace = true }
crossterm            = { workspace = true }
dirs                 = { workspace = true }
ignore               = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
libc                 = { workspace = true }
notify               = { workspace = true }
nucleo-matcher       = { workspace = true }
processkit           = { workspace = true }
pulldown-cmark       = { workspace = true }
ratatui              = { workspace = true }
rayon                = { workspace = true }
reqwest              = { workspace = true, features = ["json"] }
rustix               = { workspace = true, features = ["process"] }
serde                = { workspace = true, features = ["derive"] }
serde_json           = { workspace = true }
sha2                 = { workspace = true }
strum                = { workspace = true, features = ["derive"] }
sysinfo              = { workspace = true }
terminal-colorsaurus = { workspace = true }
tokei                = { workspace = true }
tokio                = { workspace = true, features = ["rt-multi-thread"] }
toml                 = { workspace = true }
tracing              = { workspace = true }
unicode-width        = { workspace = true }
walkdir              = { workspace = true }

# tui_pane provides the framework used by the binary.
tui_pane = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
