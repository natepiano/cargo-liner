nextest-version = { required = "0.9.138" }

experimental = ["setup-scripts", "wrapper-scripts"]

[scripts.wrapper.cargo-berth-scratch]
command = { command-line = "crates/cargo-berth/tests/check-test-scratch.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter      = 'package(cargo-berth) | package(cargo-berth-test-support)'
run-wrapper = 'cargo-berth-scratch'

[scripts.setup.cargo-berth-templates]
command = { command-line = "crates/cargo-berth/tests/setup-recorded-templates.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = 'package(cargo-berth)'
setup  = 'cargo-berth-templates'

# The source-switch test needs a command pane that other reader tests cannot crowd.
# The SIGKILL test needs an exclusive slot for its short writer-start deadline.
[[profile.default.overrides]]
filter = """
binary_id(cargo-tile::unit_tests) & (
    test(=shim_registration::reader_scenarios::reader_keeps_parent_family_across_its_only_childs_source_switch) |
    test(=shim_registration::reader_scenarios::reader_scenario_sigkill_ends_its_waiting_writer_group)
)
"""
threads-required = "num-cpus"
# These tests take every slot before other tests start.
priority = 100

# This group limits concurrent reader tests. The exclusive tests above use every slot.
[test-groups.cargo-tile-readers]
max-threads = 1

[[profile.default.overrides]]
filter = """
binary_id(cargo-tile::unit_tests) & (
    test(=shim_registration::reader_scenarios::reader_accepts_live_writer_under_different_locale_and_timezone) |
    test(=shim_registration::reader_scenarios::reader_ignores_foreign_owned_account_and_reports_its_owner_in_settings) |
    test(=shim_registration::reader_scenarios::reader_opens_settings_when_resize_and_key_are_pending_together) |
    test(=shim_registration::reader_scenarios::reader_attributes_compiler_cache_server_cpu_to_the_requesting_invocation) |
    test(=shim_registration::reader_scenarios::reader_keeps_one_direct_row_for_quiet_json) |
    test(=shim_registration::reader_scenarios::reader_excludes_a_live_command_without_sweeping_its_capture)
)
"""
test-group = "cargo-tile-readers"
# The group runs one test at a time. Started in binary order, its chain of
# about 16s ended the run; started first, it finishes alongside everything else.
priority = 90

# The capture shim's no-terminal path tees stderr through a FIFO. On macOS CI a
# run once hung in that path for two hours; each of these tests finishes in
# under a second, so a stuck one is terminated after two minutes instead.
[[profile.default.overrides]]
filter       = 'binary_id(cargo-tile::shim_modes)'
slow-timeout = { period = "30s", terminate-after = 4 }

# A reader scenario ends itself: its script fails at 20s with a line naming
# what it waited for, and stops hard at 25s. This cap sits above both, so it
# ends only a hang the script cannot report. On macOS CI one such hang ran to
# the job's 15-minute limit.
[[profile.default.overrides]]
filter       = 'binary_id(cargo-tile::unit_tests) & test(/^shim_registration::reader_scenarios::/)'
slow-timeout = { period = "20s", terminate-after = 2 }

# Loaded natedev tests reached 2.3s. Allow the 30s child deadline and cleanup
# to run before terminating a test that cannot report its own stalled wait.
[[profile.default.overrides]]
filter       = 'package(cargo-berth) | package(cargo-berth-test-support)'
slow-timeout = { period = "5s", terminate-after = 8 }
